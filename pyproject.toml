[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inet-helpdesk-mcp"
version = "0.1.0"
description = "MCP server for the i-net HelpDesk Ticket Web-API (read, create and act on tickets from any AI agent)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "roddyst" }]
keywords = ["mcp", "i-net", "helpdesk", "ticket", "web-api", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/roddyst/i-net_mcp_server"
Issues = "https://github.com/roddyst/i-net_mcp_server/issues"

[project.scripts]
inet-helpdesk-mcp = "inet_helpdesk_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inet_helpdesk_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
